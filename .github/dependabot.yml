# Automatyczne aktualizacje zależności (audyt bezpieczeństwa, F-02).
# Poprawki bezpieczeństwa Dependabot otwiera niezależnie od tego harmonogramu,
# gdy w repozytorium włączone są "Dependabot security updates".
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Drobne aktualizacje zbieramy w jeden PR, żeby nie zasypywać repozytorium.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
