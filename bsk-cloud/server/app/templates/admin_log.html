{% extends "base.html" %}
{% block content %}
<h1>Dziennik zdarzeń</h1>
<section class="card">
<table class="list">
  <thead><tr><th>Czas (UTC)</th><th>Użytkownik</th><th>Zdarzenie</th><th>Szczegóły</th></tr></thead>
  <tbody>
  {% for e in events %}
  <tr><td>{{ e.ts|dt }}</td><td>{{ e.username or '—' }}</td><td>{{ e.action }}</td><td class="small">{{ e.detail }}</td></tr>
  {% endfor %}
  </tbody>
</table>
</section>
{% endblock %}
