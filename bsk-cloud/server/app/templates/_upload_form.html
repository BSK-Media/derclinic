<form method="post" action="{{ upload_action }}" enctype="multipart/form-data" class="stack upload" data-upload>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label class="drop">
    <input type="file" name="files" multiple required>
    <span>Przeciągnij pliki tutaj albo kliknij, aby wybrać (maks. {{ max_upload_mb }} MB na plik)</span>
  </label>
  <label>Komentarz do wysyłki (opcjonalnie)
    <textarea name="note" rows="2" maxlength="500" placeholder="np. poprawiona wersja logo, wersja 3"></textarea>
  </label>
  <progress value="0" max="100" hidden></progress>
  <button class="primary">Wyślij</button>
</form>
